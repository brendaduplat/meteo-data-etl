[project]
name = "meteo-data-etl"
version = "0.1.0"
description = "Weather data ETL pipeline for Salvador, BA, built as a data engineering study project"
readme = "README.md"
authors = [
    { name = "Brenda Duplat", email = "brendaduplat352@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pandas>=3.0.5",
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.52",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
